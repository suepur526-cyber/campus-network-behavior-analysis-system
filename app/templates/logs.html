{% extends "base.html" %}
{% block title %}日志检索查询{% endblock %}
{% block content %}
<section class="panel">
  <div class="filters">
    <input id="keyword" placeholder="用户/IP/目标关键词">
    <select id="userType"><option value="">全部用户</option><option value="student">学生</option><option value="teacher">教师</option><option value="visitor">访客</option></select>
    <select id="protocol"><option value="">全部协议</option><option>HTTPS</option><option>HTTP</option><option>TCP</option><option>UDP</option><option>DNS</option></select>
    <select id="isAnomaly"><option value="">全部状态</option><option value="true">仅异常</option><option value="false">仅正常</option></select>
    <button id="searchLogs">查询</button>
    <a class="button-link" id="exportLogs" href="/api/logs/export?per_page=50&page=1">导出CSV</a>
  </div>
  <div class="pager">
    <button id="prevPage" type="button">上一页</button>
    <span id="pageInfo">第 1 页</span>
    <button id="nextPage" type="button">下一页</button>
  </div>
  <div class="table-wrap"><table><thead><tr><th>时间</th><th>用户</th><th>类型</th><th>IP</th><th>目标</th><th>协议</th><th>端口</th><th>流量</th><th>状态</th></tr></thead><tbody id="logsTable"></tbody></table></div>
</section>
{% endblock %}
